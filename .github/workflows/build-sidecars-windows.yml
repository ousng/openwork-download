name: Build Sidecars (Windows)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform'
        required: false
        default: 'x86_64-pc-windows-msvc'
        type: choice
        options:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc

permissions:
  contents: write

jobs:
  build-sidecars:
    name: Build Windows Sidecars
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ github.event.inputs.target || 'x86_64-pc-windows-msvc' }}

      - name: Download OpenCode sidecar
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_GITHUB_REPO: ${{ vars.OPENCODE_GITHUB_REPO || 'anomalyco/opencode' }}
        run: |
          set -euo pipefail

          repo="${OPENCODE_GITHUB_REPO:-anomalyco/opencode}"
          version="$(node -e "const fs=require('fs'); const parsed=JSON.parse(fs.readFileSync('constants.json','utf8')); process.stdout.write(String(parsed.opencodeVersion||'').trim().replace(/^v/,''));")"
          version="$(echo "$version" | tr -d '\r\n' | sed 's/^v//')"

          if [ -z "$version" ]; then
            echo "Unable to resolve OpenCode version from constants.json." >&2
            exit 1
          fi

          opencode_asset="opencode-windows-x64-baseline.zip"
          url="https://github.com/${repo}/releases/download/v${version}/${opencode_asset}"
          tmp_dir="$RUNNER_TEMP/opencode"
          extract_dir="$tmp_dir/extracted"
          rm -rf "$tmp_dir"
          mkdir -p "$extract_dir"

          curl_headers=()
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            curl_headers+=( -H "Authorization: Bearer ${GITHUB_TOKEN}" )
          fi
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "${curl_headers[@]}" -o "$tmp_dir/$opencode_asset" "$url"
          unzip -o "$tmp_dir/$opencode_asset" -d "$extract_dir"

          if [ -f "$extract_dir/opencode.exe" ]; then
            bin_path="$extract_dir/opencode.exe"
          else
            echo "OpenCode binary not found in archive"
            ls -la "$extract_dir"
            exit 1
          fi

          target_name="opencode-x86_64-pc-windows-msvc.exe"
          mkdir -p apps/desktop/src-tauri/sidecars
          cp "$bin_path" "apps/desktop/src-tauri/sidecars/${target_name}"

      - name: Prepare desktop sidecars
        run: pnpm -C apps/desktop prepare:sidecar
        env:
          OPENWORK_SIDECAR_FORCE_BUILD: "1"
          TAURI_ENV_TARGET_TRIPLE: ${{ github.event.inputs.target || 'x86_64-pc-windows-msvc' }}

      - name: List sidecars
        run: dir apps\desktop\src-tauri\sidecars

      - name: Upload sidecars artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwork-sidecars-windows
          path: apps/desktop/src-tauri/sidecars/
          retention-days: 30

      - name: Create Release (optional)
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: sidecars-${{ github.run_id }}
          files: apps/desktop/src-tauri/sidecars/*
          draft: true
