name: Offline Cargo Vendor

on:
  workflow_dispatch:

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libwebkit2gtk-4.0-dev libappindicator3-dev

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 执行 Vendor
        run: |
          cd apps/desktop/src-tauri/
          cargo vendor --versioned-dirs vendor

      # 添加：打包 vendor 目录为 tar.gz（保留所有文件包括隐藏文件）
      - name: 打包 Vendor 目录
        run: |
          cd apps/desktop/src-tauri/
          tar -czf vendor.tar.gz vendor/

      - name: 上传 Vendor 包
        uses: actions/upload-artifact@v4
        with:
          name: openwork-vendor-dependencies
          path: apps/desktop/src-tauri/vendor.tar.gz
